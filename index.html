<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Love Luxe - Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="brand">
            <h1>LOVE LUXE</h1>
            <p>BY EA • EST. 2024</p>
        </div>

        <div class="account">
            <span class="user-icon">●</span>
            <span>Guest</span>
        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main class="container">

        <section class="welcome">

            <h2>Welcome, Customer!</h2>

            <p>
                Browse our products and enjoy shopping.
            </p>

        </section>


        <!-- PRODUCT CATEGORIES -->

        <section class="categories">

            <div class="category bags" onclick="openCategory('Bags')">

                <div class="image-placeholder">
                    👜
                </div>

                <h3>Bags</h3>

            </div>


            <div class="category clothing" onclick="openCategory('Clothing')">

                <div class="image-placeholder">
                    👔
                </div>

                <h3>Clothing</h3>

            </div>


            <div class="category bodycare" onclick="openCategory('Body Care Products')">

                <div class="image-placeholder">
                    🧴
                </div>

                <h3>Body Care Products</h3>

            </div>

        </section>


        <!-- MESSAGE -->

        <p id="message"></p>

    </main>


    <script src="script.js"></script>

</body>

</html>
